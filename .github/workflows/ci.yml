name: Dwellora foundation checks

on:
  push:
    branches:
      - master
      - "stabilization/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Django checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dwellora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dwellora/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q .
      - name: Run Django system checks
        run: python manage.py check
      - name: Run account and property tests
        run: python manage.py test accounts.tests property.tests --verbosity 2

  frontend:
    name: React and TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dwellora/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
